<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logowanie — TaskBoard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="style/style.css" rel="stylesheet" />
</head>
<body>
  <main class="container py-4">
    <div id="alertBox" class="alert alert-danger alert-dismissible d-none auth-wrapper mt-0 mb-3" role="alert">
      <span id="alertText"></span>
      <button type="button" class="btn-close" id="alertCloseBtn" aria-label="Close"></button>
    </div>

    <section class="auth-wrapper">
      <div class="text-center mb-4">
        <h1 class="fw-bold mb-1">TaskBoard</h1>
        <div class="text-muted">Zadania zespołu w jednym miejscu</div>
      </div>

      <div class="auth-card">
        <ul class="nav nav-tabs px-3 pt-2" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="tabLoginBtn" type="button">Logowanie</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="tabRegisterBtn" type="button">Rejestracja</button>
          </li>
        </ul>

        <form id="loginForm" class="p-4" novalidate>
          <div class="mb-3">
            <label for="loginInput" class="form-label">Login</label>
            <input type="text" class="form-control" id="loginInput" required />
          </div>
          <div class="mb-4">
            <label for="passwordInput" class="form-label">Hasło</label>
            <input type="password" class="form-control" id="passwordInput" required />
          </div>
          <button type="submit" class="btn btn-accent w-100 py-2 fw-medium">Zaloguj się</button>
        </form>

        <form id="registerForm" class="p-4 d-none" novalidate>
          <div class="mb-3">
            <label for="regLogin" class="form-label">Login</label>
            <input type="text" class="form-control" id="regLogin" />
            <div class="invalid-feedback">Login: 3–30 znaków, litery, cyfry, kropka, myślnik lub podkreślnik</div>
            <div class="form-text">3–30 znaków: litery, cyfry, kropka, myślnik lub podkreślnik.</div>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="regFirstName" class="form-label">Imię</label>
              <input type="text" class="form-control" id="regFirstName" />
              <div class="invalid-feedback">Podaj imię</div>
            </div>
            <div class="col-md-6">
              <label for="regLastName" class="form-label">Nazwisko</label>
              <input type="text" class="form-control" id="regLastName" />
              <div class="invalid-feedback">Podaj nazwisko</div>
            </div>
          </div>
          <div class="mb-3">
            <label for="regPassword" class="form-label">Hasło</label>
            <input type="password" class="form-control" id="regPassword" />
            <div class="invalid-feedback">Hasło musi mieć co najmniej 8 znaków</div>
            <div class="form-text">Co najmniej 8 znaków.</div>
          </div>
          <div class="mb-4">
            <label for="regPasswordConfirm" class="form-label">Powtórz hasło</label>
            <input type="password" class="form-control" id="regPasswordConfirm" />
            <div class="invalid-feedback">Hasła muszą być takie same</div>
          </div>
          <button type="submit" class="btn btn-accent w-100 py-2 fw-medium">Utwórz konto</button>
        </form>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
</body>
</html>
