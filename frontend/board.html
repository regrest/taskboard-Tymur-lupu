<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tablica — TaskBoard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="style/style.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-dark navbar-tb py-2 px-3">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold mb-0" href="/boards.html">TaskBoard</a>
      <div class="d-flex align-items-center gap-3">
        <span class="text-light small" id="loggedUserLabel"></span>
        <button class="btn btn-outline-light btn-sm" id="logoutBtn" type="button">Wyloguj</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div id="alertBox" class="alert alert-danger alert-dismissible d-none" role="alert">
      <span id="alertText"></span>
      <button type="button" class="btn-close" id="alertCloseBtn" aria-label="Close"></button>
    </div>
    <div id="infoBox" class="alert alert-success alert-dismissible d-none" role="alert">
      <span id="infoText"></span>
      <button type="button" class="btn-close" id="infoCloseBtn" aria-label="Close"></button>
    </div>

    <div class="mb-2 small text-muted">
      <a href="/boards.html" class="text-decoration-none">Tablice</a> / <span id="breadcrumbBoardName"></span>
    </div>

    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
      <div>
        <h2 class="fw-bold mb-1" id="boardTitleHeading"></h2>
        <div class="text-muted" id="boardDescHeading"></div>
      </div>
      <button class="btn btn-accent" id="openNewTaskBtn" type="button">Dodaj zadanie</button>
    </div>

    <div class="row g-3 align-items-end mb-4">
      <div class="col-md-3">
        <label for="filterPriority" class="form-label small fw-medium">Priorytet</label>
        <select id="filterPriority" class="form-select">
          <option value="all">Wszystkie</option>
          <option value="high">Wysoki</option>
          <option value="medium">Średni</option>
          <option value="low">Niski</option>
        </select>
      </div>
      <div class="col-md-3">
        <label for="filterAssignee" class="form-label small fw-medium">Osoba</label>
        <select id="filterAssignee" class="form-select">
          <option value="all">Wszyscy</option>
        </select>
      </div>
      <div class="col-md-4">
        <label for="filterSearch" class="form-label small fw-medium">Szukaj w tytułach</label>
        <input type="search" id="filterSearch" class="form-control" placeholder="np. README" />
      </div>
      <div class="col-md-2">
        <button type="button" id="clearFiltersBtn" class="btn btn-outline-secondary w-100">Wyczyść filtry</button>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-4">
        <div class="kanban-col col-todo">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0">Do zrobienia</h5>
            <span class="col-count" id="countTodo">0</span>
          </div>
          <div id="colTodoTasks"></div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="kanban-col col-progress">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0">W trakcie</h5>
            <span class="col-count" id="countProgress">0</span>
          </div>
          <div id="colProgressTasks"></div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="kanban-col col-done">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0">Gotowe</h5>
            <span class="col-count" id="countDone">0</span>
          </div>
          <div id="colDoneTasks"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- MODAL: NOWE ZADANIE / SZCZEGÓŁY I EDYCJA -->
  <div class="modal fade" id="taskModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="taskModalTitle">Nowe zadanie</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="taskForm" novalidate>
          <div class="modal-body">
            <input type="hidden" id="taskEditId" />
            <div class="mb-3">
              <label for="taskTitleInput" class="form-label">Tytuł</label>
              <input type="text" class="form-control" id="taskTitleInput" />
              <div class="invalid-feedback">Tytuł musi mieć od 3 do 100 znaków</div>
            </div>
            <div class="mb-3">
              <label for="taskDescInput" class="form-label">Opis (opcjonalnie)</label>
              <textarea class="form-control" id="taskDescInput" rows="4"></textarea>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label for="taskStatusInput" class="form-label">Status</label>
                <select class="form-select" id="taskStatusInput">
                  <option value="todo">Do zrobienia</option>
                  <option value="in_progress">W trakcie</option>
                  <option value="done">Gotowe</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="taskPriorityInput" class="form-label">Priorytet</label>
                <select class="form-select" id="taskPriorityInput">
                  <option value="low">Niski</option>
                  <option value="medium">Średni</option>
                  <option value="high">Wysoki</option>
                </select>
              </div>
            </div>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="taskDeadlineInput" class="form-label">Termin (opcjonalnie)</label>
                <input type="date" class="form-control" id="taskDeadlineInput" />
              </div>
              <div class="col-md-6">
                <label for="taskAssigneeInput" class="form-label">Osoba (opcjonalnie)</label>
                <select class="form-select" id="taskAssigneeInput">
                  <option value="">Nieprzypisane</option>
                </select>
              </div>
            </div>
            <div class="small text-muted mt-3 d-none" id="taskCreatedAtInfo"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Anuluj</button>
            <button type="submit" class="btn btn-accent">Zapisz zadanie</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- MODAL: POTWIERDZENIE USUNIĘCIA ZADANIA -->
  <div class="modal fade" id="confirmDeleteTaskModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Potwierdź usunięcie</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          Czy na pewno chcesz usunąć zadanie <strong id="deleteTaskTitleText"></strong>?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Anuluj</button>
          <button type="button" class="btn btn-danger" id="confirmDeleteTaskBtn">Usuń</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/board.js"></script>
</body>
</html>
