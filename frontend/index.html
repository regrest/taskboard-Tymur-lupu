<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskBoard – Logowanie</title>
  <link href="https://jsdelivr.net" rel="stylesheet">
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5" style="max-width: 440px;">
        <div class="text-center mb-4">
          <h1 class="fw-bold mb-1">TaskBoard</h1>
          <p class="text-muted small mb-0">Zadania zespołu w jednym miejscu</p>
        </div>

        <div id="authAlert" class="alert alert-danger alert-dismissible fade show d-none" role="alert">
          <span id="authAlertText"></span>
          <button type="button" class="btn-close" id="closeAuthAlert"></button>
        </div>

        <div class="card shadow-sm">
          <div class="card-header bg-white pt-3 px-3 pb-0">
            <ul class="nav nav-tabs card-header-tabs">
              <li class="nav-item">
                <button class="nav-link active" id="tabLogin" type="button">Logowanie</button>
              </li>
              <li class="nav-item">
                <button class="nav-link" id="tabRegister" type="button">Rejestracja</button>
              </li>
            </ul>
          </div>
          <div class="card-body p-4">
            <!-- Formularz logowania -->
            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label class="form-label small fw-semibold">Login</label>
                <input type="text" id="loginInput" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label small fw-semibold">Hasło</label>
                <input type="password" id="loginPasswordInput" class="form-control" required>
              </div>
              <button type="submit" class="btn btn-teal w-100">Zaloguj się</button>
            </form>

            <!-- Formularz rejestracji -->
            <form id="registerForm" class="d-none" novalidate>
              <div class="mb-3">
                <label class="form-label small fw-semibold">Login</label>
                <input type="text" id="regLogin" class="form-control" required>
                <div class="invalid-feedback">Login: 3–30 znaków, litery, cyfry, kropka, myślnik lub podkreślnik</div>
                <div class="form-text">3–30 znaków: litery, cyfry, kropka, myślnik lub podkreślnik.</div>
              </div>
              <div class="row g-2 mb-3">
                <div class="col-6">
                  <label class="form-label small fw-semibold">Imię</label>
                  <input type="text" id="regFirstName" class="form-control" required>
                  <div class="invalid-feedback">Podaj imię</div>
                </div>
                <div class="col-6">
                  <label class="form-label small fw-semibold">Nazwisko</label>
                  <input type="text" id="regLastName" class="form-control" required>
                  <div class="invalid-feedback">Podaj nazwisko</div>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label small fw-semibold">Hasło</label>
                <input type="password" id="regPassword" class="form-control" required>
                <div class="invalid-feedback">Hasło musi mieć co najmniej 8 znaków</div>
                <div class="form-text">Co najmniej 8 znaków.</div>
              </div>
              <div class="mb-3">
                <label class="form-label small fw-semibold">Powtórz hasło</label>
                <input type="password" id="regPasswordConfirm" class="form-control" required>
                <div class="invalid-feedback">Hasła muszą być takie same</div>
              </div>
              <button type="submit" class="btn btn-teal w-100">Utwórz konto</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://jsdelivr.net"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
