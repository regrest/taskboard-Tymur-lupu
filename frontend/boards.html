<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskBoard – Tablice</title>
  <link href="https://jsdelivr.net" rel="stylesheet">
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <nav class="navbar navbar-dark navbar-custom px-3 px-md-4">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#" id="navBrandLink">TaskBoard</a>
      <div class="d-flex align-items-center gap-3 text-white">
        <span class="small text-white-50">Zalogowano: <strong id="navUserName" class="text-white"></strong></span>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm">Wyloguj</button>
      </div>
    </div>
  </nav>

  <!-- Widok listy tablic -->
  <div id="boardsView" class="container-fluid px-3 px-md-4 py-4">
    <div id="globalAlert" class="alert alert-success alert-dismissible fade show d-none" role="alert">
      <span id="globalAlertText"></span>
      <button type="button" class="btn-close" id="closeGlobalAlert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fw-bold mb-0">Tablice</h2>
      <button id="openNewBoardModalBtn" class="btn btn-teal">Nowa tablica</button>
    </div>

    <div id="boardsGrid" class="row g-3"></div>
  </div>

  <!-- Widok konkretnej tablicy (Kanban) -->
  <div id="boardDetailView" class="container-fluid px-3 px-md-4 py-4 d-none">
    <nav aria-label="breadcrumb" class="mb-1">
      <ol class="breadcrumb small mb-1">
        <li class="breadcrumb-item"><a href="#" id="backToBoardsLink" class="text-teal">Tablice</a></li>
        <li class="breadcrumb-item active" id="breadcrumbBoardTitle"></li>
      </ol>
    </nav>

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-2 mb-4">
      <div>
        <h2 class="fw-bold mb-1" id="boardTitleHeader"></h2>
        <p class="text-muted mb-0" id="boardDescHeader"></p>
      </div>
      <button id="openNewTaskModalBtn" class="btn btn-teal">Dodaj zadanie</button>
    </div>

    <!-- Filtry -->
    <div class="row g-2 align-items-end mb-4">
      <div class="col-12 col-md-3">
        <label class="form-label small fw-semibold mb-1">Priorytet</label>
        <select id="filterPriority" class="form-select">
          <option value="">Wszystkie</option>
          <option value="wysoki">Wysoki</option>
          <option value="sredni">Średni</option>
          <option value="niski">Niski</option>
        </select>
      </div>
      <div class="col-12 col-md-3">
        <label class="form-label small fw-semibold mb-1">Osoba</label>
        <select id="filterAssignee" class="form-select">
          <option value="">Wszyscy</option>
        </select>
      </div>
      <div class="col-12 col-md-4">
        <label class="form-label small fw-semibold mb-1">Szukaj w tytułach</label>
        <div class="input-group">
          <input type="text" id="filterSearch" class="form-control" placeholder="np. README">
          <button class="btn btn-outline-secondary d-none" type="button" id="clearSearchBtn">&times;</button>
        </div>
      </div>
      <div class="col-12 col-md-2">
        <button id="clearFiltersBtn" class="btn btn-outline-secondary w-100">Wyczyść filtry</button>
      </div>
    </div>

    <!-- Powiadomienie nad kolumnami (jak na 5. screenie) -->
    <div id="boardAlert" class="alert alert-success alert-dismissible fade show d-none" role="alert">
      <span id="boardAlertText"></span>
      <button type="button" class="btn-close" id="closeBoardAlert"></button>
    </div>

    <!-- Kolumny Kanban -->
    <div class="row g-3">
      <div class="col-12 col-lg-4">
        <div class="kanban-col col-todo">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold mb-0">Do zrobienia</h6>
            <span class="col-counter" id="countTodo">0</span>
          </div>
          <div id="colTodoList" class="d-flex flex-column gap-3"></div>
        </div>
      </div>

      <div class="col-12 col-lg-4">
        <div class="kanban-col col-inprogress">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold mb-0">W trakcie</h6>
            <span class="col-counter" id="countInProgress">0</span>
          </div>
          <div id="colInProgressList" class="d-flex flex-column gap-3"></div>
        </div>
      </div>

      <div class="col-12 col-lg-4">
        <div class="kanban-col col-done">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold mb-0">Gotowe</h6>
            <span class="col-counter" id="countDone">0</span>
          </div>
          <div id="colDoneList" class="d-flex flex-column gap-3"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Nowa / Edytuj tablicę -->
  <div class="modal fade" id="boardModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="boardModalTitle">Nowa tablica</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="boardForm" novalidate>
          <div class="modal-body">
            <input type="hidden" id="boardEditId">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Nazwa</label>
              <input type="text" id="boardNameInput" class="form-control" required>
              <div class="invalid-feedback">Nazwa tablicy musi mieć od 3 do 100 znaków</div>
            </div>
            <div class="mb-2">
              <label class="form-label small fw-semibold">Opis (opcjonalnie)</label>
              <textarea id="boardDescInput" class="form-control" rows="3"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Anuluj</button>
            <button type="submit" class="btn btn-teal">Zapisz tablicę</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal: Nowe / Szczegóły zadania -->
  <div class="modal fade" id="taskModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="taskModalTitle">Nowe zadanie</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="taskForm" novalidate>
          <div class="modal-body">
            <input type="hidden" id="taskEditId">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Tytuł</label>
              <input type="text" id="taskTitleInput" class="form-control" required>
              <div class="invalid-feedback">Tytuł musi mieć od 3 do 100 znaków</div>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Opis (opcjonalnie)</label>
              <textarea id="taskDescInput" class="form-control" rows="3"></textarea>
            </div>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Status</label>
                <select id="taskStatusInput" class="form-select">
                  <option value="do_zrobienia">Do zrobienia</option>
                  <option value="w_trakcie">W trakcie</option>
                  <option value="gotowe">Gotowe</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Priorytet</label>
                <select id="taskPriorityInput" class="form-select">
                  <option value="niski">Niski</option>
                  <option value="sredni" selected>Średni</option>
                  <option value="wysoki">Wysoki</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Termin (opcjonalnie)</label>
                <input type="date" id="taskDueDateInput" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Osoba (opcjonalnie)</label>
                <select id="taskAssigneeInput" class="form-select">
                  <option value="">Nieprzypisane</option>
                </select>
              </div>
            </div>
            <div id="taskCreatedAtInfo" class="text-muted small mt-3 d-none"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Anuluj</button>
            <button type="submit" class="btn btn-teal">Zapisz zadanie</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://jsdelivr.net"></script>
  <script src="js/api.js"></script>
  <script src="js/boards.js"></script>
</body>
</html>
