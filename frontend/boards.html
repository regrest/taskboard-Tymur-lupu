<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tablice — TaskBoard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="style/style.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-dark navbar-tb py-2 px-3">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold mb-0" href="/boards.html">TaskBoard</a>
      <div class="d-flex align-items-center gap-3">
        <span class="text-light small" id="loggedUserLabel"></span>
        <button class="btn btn-outline-light btn-sm" id="logoutBtn" type="button">Wyloguj</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div id="alertBox" class="alert alert-danger alert-dismissible d-none" role="alert">
      <span id="alertText"></span>
      <button type="button" class="btn-close" id="alertCloseBtn" aria-label="Close"></button>
    </div>
    <div id="infoBox" class="alert alert-success alert-dismissible d-none" role="alert">
      <span id="infoText"></span>
      <button type="button" class="btn-close" id="infoCloseBtn" aria-label="Close"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fw-bold mb-0">Tablice</h2>
      <button class="btn btn-accent" id="openNewBoardBtn" type="button">Nowa tablica</button>
    </div>

    <div class="row g-4" id="boardsGrid"></div>
  </main>

  <!-- MODAL: NOWA / EDYCJA TABLICY -->
  <div class="modal fade" id="boardModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="boardModalTitle">Nowa tablica</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="boardForm">
          <div class="modal-body">
            <input type="hidden" id="boardEditId" />
            <div class="mb-3">
              <label for="boardNameInput" class="form-label">Nazwa</label>
              <input type="text" class="form-control" id="boardNameInput" maxlength="80" required />
            </div>
            <div>
              <label for="boardDescInput" class="form-label">Opis (opcjonalnie)</label>
              <textarea class="form-control" id="boardDescInput" rows="4"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Anuluj</button>
            <button type="submit" class="btn btn-accent">Zapisz tablicę</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- MODAL: POTWIERDZENIE USUNIĘCIA TABLICY -->
  <div class="modal fade" id="confirmDeleteBoardModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Potwierdź usunięcie</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          Czy na pewno chcesz usunąć tablicę <strong id="deleteBoardNameText"></strong>?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Anuluj</button>
          <button type="button" class="btn btn-danger" id="confirmDeleteBoardBtn">Usuń</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/boards.js"></script>
</body>
</html>
